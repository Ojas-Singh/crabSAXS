name: Release

on:
  push:
    tags:
      - '0.1.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package and publish
        required: true
        default: '0.1.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package/crabsaxs-${RELEASE_TAG}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/crabsaxs package/crabsaxs-${RELEASE_TAG}-${{ matrix.target }}/
          cp README.md LICENSE CHANGELOG.md package/crabsaxs-${RELEASE_TAG}-${{ matrix.target }}/
          tar -C package -czf crabsaxs-${RELEASE_TAG}-${{ matrix.target }}.tar.gz crabsaxs-${RELEASE_TAG}-${{ matrix.target }}
          shasum -a 256 crabsaxs-${RELEASE_TAG}-${{ matrix.target }}.tar.gz > crabsaxs-${RELEASE_TAG}-${{ matrix.target }}.sha256
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/crabsaxs-${env:RELEASE_TAG}-${{ matrix.target }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/crabsaxs.exe package/crabsaxs-${env:RELEASE_TAG}-${{ matrix.target }}/
          Copy-Item README.md,LICENSE,CHANGELOG.md package/crabsaxs-${env:RELEASE_TAG}-${{ matrix.target }}/
          Compress-Archive -Path package/crabsaxs-${env:RELEASE_TAG}-${{ matrix.target }} -DestinationPath crabsaxs-${env:RELEASE_TAG}-${{ matrix.target }}.zip
          (Get-FileHash crabsaxs-${env:RELEASE_TAG}-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  crabsaxs-${env:RELEASE_TAG}-${{ matrix.target }}.zip" | Out-File -Encoding ascii crabsaxs-${env:RELEASE_TAG}-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: crabsaxs-${{ matrix.target }}
          path: |
            crabsaxs-${{ inputs.release_tag || github.ref_name }}-${{ matrix.target }}.*

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            --title "CrabSAXS $RELEASE_TAG" \
            --generate-notes
