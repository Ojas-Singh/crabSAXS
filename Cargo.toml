[package]
name = "crabsaxs"
version = "0.1.0"
edition = "2021"
description = "Fast, reproducible SAXS calculation and fitting for atomic structures"
license = "MIT"
authors = ["Ojas Singh"]
repository = "https://github.com/Ojas-Singh/crabSAXS"
readme = "README.md"
rust-version = "1.97"
keywords = ["saxs", "scattering", "structural-biology", "bioinformatics"]
categories = ["science"]
default-run = "crabsaxs"
autobins = false
exclude = [
    "/AGENT.md",
    "/.DS_Store",
    "/Pepsi-SAXS",
    "/examples/data/benchmarks/**",
    "/docs/benchmark-reports/**",
]

[[bin]]
name = "crabsaxs"
path = "src/main.rs"

[[bin]]
name = "saxs-compare"
path = "src/bin/saxs-compare.rs"
required-features = ["comparison-harness"]


[lib]
name = "crabsaxs"
path = "src/lib.rs"

[features]
default = []
comparison-harness = []

[dependencies]
# Linear algebra / numerics
nalgebra = "0.33"
ndarray = "0.16"

# Parallelism over atom pairs / q-grid
rayon = "1.10"

# PDB/mmCIF parsing
pdbtbx = "0.12"

# CLI
clap = { version = "=4.5.4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Optimization (Nelder-Mead / Levenberg-Marquardt style fitting)
argmin = "0.10"
argmin-math = "0.4"

# Serialization for config / intermediate output
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
rand_chacha = "0.3"
glob = "0.3"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "debye_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
